<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>利禄卡 Online Test</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f1df;
      color: #171717;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 18px 16px 28px;
    }

    .card {
      background: #fffaf0;
      border: 3px solid #171717;
      border-radius: 22px;
      box-shadow: 6px 6px 0 #171717;
      padding: 16px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.05;
      margin: 8px 0 6px;
    }

    .sub {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.72;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 3px solid #171717;
      border-radius: 14px;
      background: white;
      padding: 0 14px;
      font-size: 18px;
      font-weight: 800;
      outline: none;
      text-transform: uppercase;
    }

    button {
      min-height: 46px;
      border: 3px solid #171717;
      border-radius: 14px;
      background: #ffe169;
      color: #171717;
      font-size: 16px;
      font-weight: 900;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #171717;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #171717;
    }

    button.secondary {
      background: #9edbff;
    }

    button.danger {
      background: #ff9bb4;
    }

    button.green {
      background: #a9f0d1;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 4px 4px 0 #171717;
    }

    .room-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 6px 12px;
      border: 3px solid #171717;
      border-radius: 999px;
      background: #171717;
      color: #fffaf0;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 2px;
    }

    .status {
      padding: 12px 14px;
      border-radius: 16px;
      border: 3px solid #171717;
      background: white;
      font-weight: 850;
      line-height: 1.45;
      min-height: 54px;
    }

    .player {
      border: 3px solid #171717;
      border-radius: 18px;
      padding: 12px;
      background: white;
    }

    .player.active {
      background: #ffe169;
    }

    .player.me {
      outline: 4px solid rgba(255, 155, 180, 0.55);
    }

    .player-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .player-name {
      font-size: 18px;
      font-weight: 950;
    }

    .score {
      font-size: 14px;
      font-weight: 900;
      border: 2px solid #171717;
      border-radius: 999px;
      padding: 3px 8px;
      background: #fffaf0;
    }

    .cards {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 58px;
      align-items: flex-start;
    }

    .mini-card {
      width: 76px;
      min-height: 50px;
      border: 2px solid #171717;
      border-radius: 12px;
      padding: 6px 6px;
      background: #fff;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.15;
    }

    .mini-card .kcal {
      font-size: 11px;
      opacity: 0.74;
      margin-top: 4px;
    }

    .type-meat { background: #ff9bb4; }
    .type-veg { background: #a9f0d1; }
    .type-main { background: #ffe169; }
    .type-dessert { background: #9edbff; }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .footer-note {
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.6;
      margin-top: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="card" id="homePanel">
      <div class="title">利禄卡<br />Online Test</div>
      <div class="sub">最小联机测试版：创建房间、加入房间、轮流抽牌、同步收手与结算。</div>

      <div style="height:14px"></div>

      <button id="createRoomBtn" style="width:100%">创建房间</button>

      <div style="height:14px"></div>

      <input id="roomInput" placeholder="输入房间码，例如 8342" maxlength="6" />
      <div style="height:10px"></div>
      <button id="joinRoomBtn" class="secondary" style="width:100%">加入房间</button>

      <p class="footer-note">
        提示：用一个普通浏览器窗口创建房间，再用另一个无痕窗口或手机输入房间码加入。
      </p>
    </section>

    <section class="card hidden" id="gamePanel">
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="sub">房间码</div>
          <div class="room-code" id="roomCodeText">----</div>
        </div>
        <button id="leaveBtn" class="danger">退出</button>
      </div>

      <div style="height:14px"></div>
      <div class="status" id="statusText">等待连接...</div>

      <div style="height:14px"></div>

      <div class="split">
        <div class="player" id="p1Box">
          <div class="player-head">
            <div class="player-name">玩家 1</div>
            <div class="score" id="p1Score">0 kcal</div>
          </div>
          <div class="cards" id="p1Cards"></div>
        </div>

        <div class="player" id="p2Box">
          <div class="player-head">
            <div class="player-name">玩家 2</div>
            <div class="score" id="p2Score">0 kcal</div>
          </div>
          <div class="cards" id="p2Cards"></div>
        </div>
      </div>

      <div class="actions">
        <button id="drawMeatBtn" class="danger">抽荤</button>
        <button id="drawVegBtn" class="green">抽素</button>
        <button id="drawMainBtn">抽主食</button>
        <button id="drawDessertBtn" class="secondary">抽甜点</button>
      </div>

      <div style="height:10px"></div>
      <button id="standBtn" style="width:100%">收手</button>

      <div style="height:10px"></div>
      <button id="resetBtn" class="secondary" style="width:100%">重新开始本房间</button>

      <p class="footer-note">
        当前是测试版：前端直接写数据库，适合验证玩法。正式上线前要改安全规则和服务器裁判。
      </p>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
